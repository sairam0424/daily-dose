name: CI

# Manual trigger only, plus the usual push/PR checks. There is deliberately NO
# `schedule:` cron trigger here yet — automated daily runs of the pipeline are
# a fast-follow that require the user's explicit go-ahead (and real LLM API
# keys, which do not exist in this environment yet). See README.md
# "Current limitations".
on:
  workflow_dispatch: {}
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default: this workflow only checks out, builds, and tests -
# it never needs to write anything back to the repo (contrast with
# daily-pipeline.yml, which explicitly requests contents: write only for its
# own auto-commit step).
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # astro@7.3.2+ (bumped to close a critical AVIF RCE, see PR #112)
          # requires Node >=22.12.0 and fails its own CLI version check
          # before running anything - confirmed via a real CI failure on
          # Node 20 ("Node.js v20.20.2 is not supported by Astro!").
          node-version: 22

      # npm ci enforces the exact locked tree (package-lock.json) instead of
      # allowing silent re-resolution the way npm install can.
      - name: Install dependencies
        run: npm ci

      # Fails on any known high/critical-severity vulnerability in the
      # resolved dependency tree. Advisory data comes from the npm registry
      # itself - no extra token or third-party service required.
      - name: Dependency audit
        run: npm audit --audit-level=high

      # tsconfig.json already extends astro/tsconfigs/strict, but `astro
      # build` below does not run full type diagnostics on its own - this is
      # the dedicated step that actually enforces it (see @astrojs/check).
      # continue-on-error is intentional and temporary: a real local run of
      # `astro check` on this codebase surfaces 37 pre-existing errors (all
      # `entry.data` typed as `unknown` from the Content Collections glob
      # loader, e.g. src/components/StoryCard.astro, src/lib/digestGrouping.ts)
      # that predate this workflow step and are out of scope for a CI-only
      # change - see this PR's description. Flip this to blocking once those
      # are fixed.
      - name: Type check
        run: npm run typecheck
        continue-on-error: true

      # Builds the Astro static site against whatever digest JSON files are
      # already committed under src/data/digest/. This does NOT invoke the
      # live pipeline (scripts/pipeline.ts) — that script makes a real network
      # call to Hacker News and is run manually to seed content, never as part
      # of CI, to avoid unnecessary load and flaky-test risk on every run.
      - name: Build
        run: npm run build

      # Automated accessibility gate: runs axe-core (via jsdom) against a
      # representative subset of the real built HTML - homepage, one archive
      # date page, methodology, privacy - failing the build on any real
      # violation. See scripts/a11yCheck.ts and docs/superpowers/plans/
      # 2026-09-10-research-sweep-fixes.md item 6a.
      - name: Accessibility check
        run: npx tsx scripts/a11yCheck.ts

      # Network-free unit/schema tests only.
      - name: Test
        run: npx vitest run
