name: Daily pipeline

# Automated daily run of the real HN + arXiv fetch -> real Bedrock LLM
# curation -> committed digest. See
# docs/adr/0004-enable-cron-automation-and-vercel-deployment.md for why this
# is a separate workflow (not folded into ci.yml), why it requests
# contents: write only on itself (the repo default is read-only), and why
# the resulting commit is a narrow, documented exception to this repo's
# "every change goes through a PR, even solo" convention (Branches.md) - it
# commits generated data only, never code.
#
# Schedule is UTC. 21:00 targets a settled Hacker News front page and lands
# after arXiv's daily new-submission announcement window on weekdays. Tune
# once real run timing has been observed.
on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

# Prevents a manual workflow_dispatch from overlapping the real schedule
# (already hit once, per the "Sync with latest main" step's own comments
# below) - a concurrent second run would double-bill the paid Bedrock call
# and race on the git push. cancel-in-progress stays false: cancelling an
# in-flight run mid-Bedrock-call would still leave the cost billed with no
# committed digest to show for it, so a second overlapping run queues
# instead of pre-empting the first.
concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  daily-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Kept in sync with ci.yml - astro@7.3.2+ (PR #112) requires
          # Node >=22.12.0. This job's own `npm run pipeline` step doesn't
          # call astro's CLI directly, but installing astro as a dependency
          # under an unsupported Node version is a real, previously
          # confirmed CI failure mode elsewhere in this repo, not a
          # theoretical one - keep both workflow files on the same floor.
          node-version: 22

      # npm ci enforces the exact locked tree (package-lock.json) instead of
      # allowing silent re-resolution the way npm install can.
      - name: Install dependencies
        run: npm ci

      # Real network calls: HN Algolia API, arXiv Atom API, and (with
      # BEDROCK_ACCESS_KEY_ID/BEDROCK_SECRET_ACCESS_KEY set as repo secrets)
      # a real, paid AWS Bedrock LLM call - see src/lib/llmCuration.ts and
      # docs/adr/0003-wire-real-bedrock-curation.md.
      - name: Run pipeline
        run: npm run pipeline
        env:
          BEDROCK_ACCESS_KEY_ID: ${{ secrets.BEDROCK_ACCESS_KEY_ID }}
          BEDROCK_SECRET_ACCESS_KEY: ${{ secrets.BEDROCK_SECRET_ACCESS_KEY }}
          BEDROCK_REGION: ${{ vars.BEDROCK_REGION }}

      # Real, previously observed failure (2026-09-04 scheduled run): if
      # another push lands on main between this job's checkout and its own
      # push below (e.g. an unrelated PR merge), the auto-commit-action's
      # push is rejected as non-fast-forward and the whole run fails -
      # wasting the real, paid Bedrock call that already ran above, with
      # no digest ever committed. Pulling immediately before the commit
      # step shrinks that race window from "this whole job's runtime" down
      # to just the auto-commit-action's own commit+push time - doesn't
      # eliminate the race entirely (a push landing in that much smaller
      # window would still fail this run), but reduces real-world exposure
      # by roughly two orders of magnitude. --autostash is required: the
      # pipeline step above already left real, uncommitted digest files in
      # the working tree, and a plain `git pull --rebase` refuses to run
      # with uncommitted changes present.
      - name: Sync with latest main before committing
        run: git pull --rebase --autostash origin main

      # Commits ONLY the generated data paths, never a blanket `git add -A`,
      # so an accidental in-progress code change on this branch could never
      # be swept into an automated commit. Bot identity (not the
      # maintainer's own) keeps automated data commits visually distinct in
      # git history. A no-op if the pipeline produced no changes (e.g. an
      # identical top-N with identical scores).
      - name: Commit generated digest data
        # Pinned to a full commit SHA, not the mutable v5 tag - a tag can be
        # re-pointed to different code later; a SHA cannot. v5 currently
        # resolves to v5.2.0 (confirmed via `gh api .../git/refs/tags/v5`).
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5.2.0
        with:
          commit_message: "chore(digest): automated daily pipeline run"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
          # commit_author defaults to github.actor (the triggering user, even
          # on a manual workflow_dispatch run) - set explicitly so the AUTHOR
          # field also always shows the bot identity, not whoever triggered
          # the run. Confirmed as a real gap during this workflow's first
          # verification run: the committer showed the bot but the author
          # still showed the human who ran workflow_dispatch.
          commit_author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          file_pattern: "src/data/digest/** src/data/stats.jsonl"

      # Failure visibility follow-up (see docs/adr/0004's Update section and
      # decisions.md's matching log entry): ADR 0004 shipped this workflow
      # with GitHub's default email-to-repo-owner as the only V1 failure
      # signal, naming richer alerting an explicit non-goal, revisitable
      # later. This is that revisit. No Slack webhook, no new secret - an
      # official, GitHub-maintained action (SHA-pinned like every other
      # action step in this workflow) files or updates a labeled Issue
      # instead. `if: failure()` means this step only runs when a prior step
      # in this job failed.
      - name: File or update failure issue
        if: failure()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const label = "automated-failure";
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const timestamp = new Date().toISOString();

            // Dedup: comment on the existing open failure issue instead of
            // filing a new one, so repeated scheduled failures don't spam
            // the issue tracker with duplicates.
            const existing = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              labels: label,
            });

            if (existing.data.length > 0) {
              const issue = existing.data[0];
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body: `Another scheduled run of \`daily-pipeline.yml\` failed.\n\nRun: ${runUrl}\nTime: ${timestamp}`,
              });
            } else {
              // issues.create auto-creates the `label` if it doesn't exist
              // yet in this repo - no separate label-creation step needed.
              await github.rest.issues.create({
                owner,
                repo,
                title: "daily-pipeline.yml scheduled run failed",
                body: `The scheduled \`daily-pipeline.yml\` run failed.\n\nRun: ${runUrl}\nTime: ${timestamp}`,
                labels: [label],
              });
            }
