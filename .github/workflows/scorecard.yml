name: OSSF Scorecard

# Supply-chain security posture check (branch protection, pinned actions,
# dependency updates, etc.). Scorecard's `pull_request`/`workflow_dispatch`
# triggers are explicitly documented as experimental, so this only runs on
# push to main plus a weekly schedule, matching the project's own supported
# trigger list. `publish_results: false` (this repo is private, so there's
# no public scorecard.dev badge to maintain) and results are uploaded as a
# short-lived workflow artifact instead of via github/codeql-action/upload
# -sarif, since that upload path needs GitHub Advanced Security -
# unverified as enabled for this private repo (see codeql.yml's comment) -
# whereas the artifact upload works regardless.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@55891bbd73f2425e97637d96e306fc9d491d0b21 # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false

      - name: Upload results as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5
