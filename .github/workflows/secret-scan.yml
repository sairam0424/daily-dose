name: Secret scan

# This repo is private, so native GitHub secret-scanning alert visibility is
# unverified without confirming GitHub Advanced Security is enabled on this
# account's plan (see codeql.yml's comment for the same caveat). Gitleaks
# gives a reliable, self-hosted safety net that doesn't depend on that -
# gitleaks-action is free for personal-account repos (no GITLEAKS_LICENSE
# needed; that's only required for organization-owned repos, and this repo
# is under a personal account, not an org).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, not just the triggering commit - gitleaks scans
          # the whole range so a secret introduced a few commits back on
          # this branch still gets caught.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PR-comment and job-summary features default to on; commenting
          # needs pull-requests: write, which this job deliberately doesn't
          # request (contents: read is enough to just fail the run on a
          # real finding) - disable it explicitly instead of silently
          # letting it 403.
          GITLEAKS_ENABLE_COMMENTS: "false"
